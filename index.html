  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: 'var(--primary-color)',
            card: 'var(--card-bg)',

            contrast: 'var(--text-color)'

  <style>
    body {
      font-family: 'Inter', sans-serif;
      /* Default variables, overridden by StoreConfigService */

      --bg-color: #f8fafc; /* slate-50 */
      --text-color: #0f172a; /* slate-900 */
      --card-bg: #ffffff;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    .dark {
      --bg-color: #0f172a; /* slate-900 */
      --text-color: #f8fafc; /* slate-50 */
      --card-bg: #1e293b; /* slate-800 */
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
    }
  </style>
<!-- Zone.js is now imported directly in index.tsx to guarantee load order -->

<script>
  function showError(type, error) {
    console.error(type, error);
    const msg = error.message || JSON.stringify(error);
    const div = document.createElement('div');
    div.style.cssText = 'background: #7f1d1d; color: #fff; padding: 20px; position: fixed; top: 0; left: 0; right: 0; z-index: 9999;';
    div.innerHTML = `<strong>${type}:</strong> ${msg}`;
    document.body.appendChild(div);
  }
  window.addEventListener('error', e => showError('Error', e.error || e.message));
  window.addEventListener('unhandledrejection', e => showError('Promise Rejection', e.reason));
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <app-root>
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Inter, sans-serif; flex-direction: column; gap: 16px;">
      <div style="width: 40px; height: 40px; border: 3px solid #e5e7eb; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <p style="color: #6b7280; font-size: 0.875rem;">Initializing OmniPOS...</p>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>
  </app-root>

</body>
